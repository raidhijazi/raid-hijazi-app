<style id="css">
/* Layout: a phone-first app shell — sticky logo bar, one scrolling view, fixed bottom tab bar; centered column up to 520px on wide screens */
:root{
  --bg:#EAF5F3; --surface:#FFFFFF; --surface-2:#F4FAF9; --line:#C9E3DF;
  --ink:#1F2830; --muted:#4D5862; --teal:#336E6A; --teal-ink:#FFFFFF;
  --coral:#B83C35; --coral-soft:#FBE4E2; --teal-soft:#DCEFEC;
  --font-body: Calibri, "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-display: Calibri, "Noto Naskh Arabic", "Noto Sans Arabic", serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B21; --surface:#1C252D; --surface-2:#222D36; --line:#2F3D48;
  --ink:#E8F1F0; --muted:#A9B7BF; --teal:#5FA39D; --teal-ink:#0E1A19;
  --coral:#F0948D; --coral-soft:#3A2526; --teal-soft:#1E3533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B21; --surface:#1C252D; --surface-2:#222D36; --line:#2F3D48;
  --ink:#E8F1F0; --muted:#A9B7BF; --teal:#5FA39D; --teal-ink:#0E1A19;
  --coral:#F0948D; --coral-soft:#3A2526; --teal-soft:#1E3533; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
button,input{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.shell{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .logo{height:46px;width:auto;display:block}
.logo-chip{background:#FFFFFF;border-radius:12px;padding:2px 6px;display:flex}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:2px solid var(--coral);display:block}
.avatar-btn{padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
main{flex:1;padding:18px 16px 110px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:21px;color:var(--coral)}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 0;min-height:44px}

/* proverb */
.proverb{background:var(--teal);color:var(--teal-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.proverb .eyebrow{font-size:13px;letter-spacing:.3px;opacity:.9;display:flex;justify-content:space-between;gap:8px}
.proverb .text{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.5}
.proverb .meaning{font-size:15.5px;opacity:.95}
.proverb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.proverb .pv-src{font-size:14px;opacity:.9}
.proverb .pv-tools{border-top:1px solid currentColor;padding-top:10px;opacity:.95}
.pill-btn{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid currentColor;background:transparent;cursor:pointer;font-weight:700}
.pill-btn.solid{background:var(--teal-ink);color:var(--teal);border-color:var(--teal-ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:112px}
.tile svg{color:var(--coral)}
.tile b{font-size:16px}
.tile span{font-size:13.5px;color:var(--muted)}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;cursor:pointer;width:100%;text-decoration:none;color:var(--ink)}
.row-card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-card .body b{font-size:16px}
.row-card .body small{color:var(--muted);font-size:13.5px;line-height:1.55}
.cover{width:56px;height:80px;flex-shrink:0;border-radius:6px;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-family:var(--font-display);font-weight:700;font-size:11px;line-height:1.35;box-shadow:inset -4px 0 0 rgba(0,0,0,.18)}
.badge{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:9px;background:var(--teal-soft);color:var(--teal)}
.badge.coral{background:var(--coral-soft);color:var(--coral)}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* chips & search */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* glossary */
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.term-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.term-head b{font-family:var(--font-display);font-size:20px;color:var(--coral)}
.term .en{direction:ltr;text-align:left;color:var(--muted);font-size:14.5px}
.term .tag{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* detail sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet .top{display:flex;gap:16px;align-items:flex-start}
.sheet .cover{width:84px;height:120px;font-size:14px}
.cover.has-img{padding:0;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.18)}.cover.has-img img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--teal);color:var(--teal-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}

/* about */
.about-hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.about-hero img.photo{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid var(--coral)}
.about-hero .logo-big{width:240px;max-width:100%}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16.5px;line-height:1.95}
.prose p{text-align:justify;text-justify:inter-word;hyphens:none}
.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.social{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{min-height:64px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(10px,3.1vw,12.5px);white-space:nowrap;padding:0 2px;min-width:0;color:var(--muted)}
.tab[aria-current="page"]{color:var(--teal);font-weight:700}
.tab svg{width:24px;height:24px}
.view[hidden]{display:none}

/* continue-reading card */
.cont{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;width:100%;text-align:start}
.cont .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}

/* reader */
.reader-top{display:flex;align-items:center;gap:8px;position:sticky;top:calc(var(--tbh,71px) + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);margin:0 -16px;padding:8px 16px;transition:box-shadow .2s}
.reader-top.stuck{box-shadow:0 6px 12px -8px rgba(40,30,20,.35)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.reader-top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.reader-top .ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.size-ctl{display:flex;gap:6px}
.toc{display:flex;flex-direction:column;gap:6px}
.toc button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start}
.toc button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:2.2em}
.toc button.read .n::after{content:" ✓";color:var(--teal)}
.toc button.current{border-color:var(--teal);background:var(--teal-soft)}
.story{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.story h1{font-size:26px;color:var(--coral)}
.story .meta{color:var(--muted);font-size:13.5px}
.story .txt{display:flex;flex-direction:column;gap:1em;font-size:var(--rs,19px);line-height:2;text-align:justify}
.gl{all:unset;cursor:pointer;color:inherit;border-bottom:2px dotted var(--coral);text-decoration:none}
.gl:hover{color:var(--coral)}
.gl:focus-visible{outline:3px solid var(--coral)}
.pager{display:flex;gap:10px}
.pager .btn{flex:1}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pop .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .ph b{font-size:19px;color:var(--coral)}
mark{background:var(--coral-soft);color:var(--ink);border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--coral)}
.hit{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:start;width:100%}
.hit .hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hit .hh b{font-size:16px}
.hit .src{font-size:13px;color:var(--muted)}
.hit .snip{font-size:15px;line-height:1.8;color:var(--ink)}
.hit .snip[dir="ltr"]{text-align:left}
.term .src{font-size:12.5px;color:var(--muted)}
.term-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mini{min-height:38px;padding:0 14px;white-space:nowrap;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700}
.mini.danger{color:var(--coral);border-color:var(--coral-soft)}
.btn.danger{background:var(--coral);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14.5px}
.field small{color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:16px;color:var(--ink);width:100%}
.field textarea{min-height:96px;resize:vertical;line-height:1.7}
.form-msg{font-size:14px;color:var(--coral);min-height:1.2em}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cand .ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cand .ch b{font-size:19px;color:var(--coral)}
.cand .ch .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.cand .snip{font-size:14.5px;line-height:1.8}
.cand .vars{font-size:12.5px;color:var(--muted)}
.sugg{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sugg .lbl{font-size:12.5px;font-weight:700;color:var(--teal)}
.sugg .lbl.warn{color:var(--coral)}
.sugg .en{direction:ltr;text-align:left;color:var(--muted);font-size:14px}
.mini.ok{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.media-box{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.media-box .lbl{font-size:13px;font-weight:700;color:var(--teal)}
audio{width:100%;height:40px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vid video{width:100%;max-width:100%;border-radius:12px;background:#000;aspect-ratio:16/9}
.vid h3{font-size:18px}
.vthumb{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,#2F6B66,#1E4A46);text-decoration:none}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#F3E7CF;font-size:15px;padding-top:70px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.vthumb .pl{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.vthumb .pl svg{margin-inline-start:4px}
.vthumb .hn{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;padding:3px 8px;border-radius:8px}
.rec-btn{background:var(--coral);border-color:var(--coral);color:#fff;display:inline-flex;align-items:center;gap:8px}.rec-btn .rec-dot{width:10px;height:10px;border-radius:50%;background:#fff}.rec-btn.on .rec-dot{animation:recp 1s infinite}@keyframes recp{50%{opacity:.25}}
/* «إلى أبي»: old photos, sepia, slightly tilted like a family album */
.father{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:linear-gradient(180deg,#FBF6EC,#F3E9D6);border:1px solid #E6D6B8;border-radius:22px;padding:22px 18px;color:#3B2F22}
.father h2{color:#8A3A33;font-size:22px}
.father .album{position:relative;display:flex;justify-content:center;min-height:150px;width:100%}
.father .album img{width:150px;height:190px;object-fit:cover;background:#fff;padding:8px 8px 26px;border-radius:4px;box-shadow:0 10px 24px rgba(59,47,34,.28);filter:sepia(.45) contrast(1.02)}
.father .album img:nth-child(1){transform:rotate(-5deg);margin-inline-end:-26px;z-index:1}
.father .album img:nth-child(2){transform:rotate(4deg);margin-top:16px}
.father .album img:only-child{transform:rotate(-2deg);margin:0}
.father blockquote{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.8;color:#3B2F22}
.father .fname{font-weight:700;color:#8A3A33}
.father .fquote{font-size:15px;color:#6B5A45}
.ded{display:flex;gap:12px;align-items:center;background:#FBF6EC;border:1px solid #E6D6B8;border-radius:16px;padding:10px 12px;color:#3B2F22}
.ded img{width:56px;height:56px;border-radius:50%;object-fit:cover;filter:sepia(.45);border:2px solid #E6D6B8;flex-shrink:0}
.ded span{font-family:var(--font-display);font-size:16px;line-height:1.6}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.thumbs img{width:96px;height:120px;object-fit:cover;border-radius:6px;filter:sepia(.45);background:#eee}
.install-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.install-card img{border-radius:12px;flex-shrink:0}
.install-card .ic-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.install-card .ic-body span{font-size:13.5px;color:var(--muted)}
.install-card .btn{min-height:42px;padding:0 16px;flex-shrink:0}
.install-card .ic-x{width:34px;height:34px;flex-shrink:0}
.ios-steps{display:flex;flex-direction:column;gap:10px;margin:0;padding-inline-start:22px;font-size:16px}
.play-btn{display:inline-flex;align-items:center;gap:6px}
.tagname{font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:30;background:var(--teal);color:var(--teal-ink);padding:10px 18px;border-radius:12px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.proverb{animation:rise .5s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

/* opening splash: photo, logo and tagline rise in, then the whole screen fades away */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding-top:calc(4vh + 18px + env(safe-area-inset-top,0px));background:radial-gradient(circle at 50% 38%,#FBF6EC 0%,#F3E8D2 62%,#E6D4B2 100%);color:#3B2F22;cursor:pointer;transition:opacity .6s ease,visibility .6s;overflow:hidden}
.splash.out{opacity:0;visibility:hidden}
.splash .sp-photo{width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid #F0948D;box-shadow:0 0 0 0 rgba(240,148,141,.55)}
.splash .sp-logo{width:220px;max-width:64vw}
.splash .sp-tag{font-family:var(--font-display);font-size:19px;letter-spacing:.3px;color:#5B4630;margin-top:-6px}
.splash .sp-pair{position:relative;width:132px;height:132px}
.splash .sp-father{position:absolute;width:118px;height:118px;border-radius:50%;object-fit:cover;filter:sepia(.6) brightness(1.05);opacity:.55;top:-26px;inset-inline-start:-70px;border:3px solid rgba(251,246,236,.7)}
.splash .sp-pair .sp-photo{position:relative}
.splash .sp-heir{font-family:var(--font-display);font-size:16px;opacity:.85;margin-top:-6px}
.splash .sp-skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.7;color:#5B4630}
.splash .sp-heir{color:#5B4630}
.splash .sp-father{border-color:rgba(91,70,48,.35)!important}
/* the writer's books gathered inside the map of Jordan, over a real photo of an old stone village */
.splash .sp-pair,.splash .sp-heir,.splash .sp-logo,.splash .sp-tag,.splash .sp-photo{position:relative;z-index:1}
.sp-map{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;opacity:.14;pointer-events:none}
.sp-map svg{display:block;width:min(100vw,96vh * .89);height:auto;overflow:visible}
.sp-village{position:absolute;left:0;right:0;bottom:0;height:calc(28vh + env(safe-area-inset-bottom,0px));z-index:0;background:url(assets/village.jpg?v=3) center 45%/cover no-repeat;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%)}

<script id="d-js">
/* mount the static markup from its template */
(function(){ const t=document.getElementById("shell"); document.body.insertBefore(t.content.cloneNode(true), t); })();
let CAN_EDIT = false, ART = null;
/* ===== CONTENT — edit here for each update ===== */
const DATA = {

    {id:"shatharat1", title:"شذرات من التراث – الجزء الأول", cat:"heritage", color:"#B83C35", url:"https://raidhijazi.com/shatharat/", readable:true, meta:"دار الكتاب، إربد", desc:"مجموعة من القصص التراثية والشعبية، الحقيقي منها والمتخيَّل، تحمل في طيّاتها الدروس والحِكَم."},
    {id:"shatharat2", title:"شذرات من التراث – الجزء الثاني", cat:"heritage", color:"#336E6A", url:"https://raidhijazi.com/shatharat2/", readable:true, meta:"الطبعة الأولى 2018", desc:"استكمال لما نشره الكاتب في الجزء الأول من قصص التراث الأردني وحكاياته، على ألسنة المختار مثقال وزريفة وأهل القرية."},
    {id:"aja", title:"أجا عبالي", cat:"heritage", color:"#4E7F7B", url:"https://raidhijazi.com/aja-3abali/", readable:true, meta:"الطبعة الأولى 2018 · مؤسسة حمادة للدراسات الجامعية والنشر والتوزيع، إربد", desc:"قصص ومقالات قصيرة تربط الماضي بالحاضر، مستمدّة من ذاكرة الطفولة وأحداثها اليومية، بأسلوب الكوميديا السوداء، وبعضها مكتوب باللهجة المحكية."},
    {id:"anwar", title:"قصة أنور الأهتر", cat:"heritage", color:"#8A3A33", url:"https://raidhijazi.com/anwar-ahtar/", readable:true, unit:"فصل", desc:"حكاية طفل في القرية فقد القدرة على النطق السليم بسبب خطأ طبي، وما واجهه في الانخراط في الحياة."},
    {id:"anwar-en", title:"Anwar The Ahtar", cat:"en", color:"#25514E", url:"https://raidhijazi.com/anwar-ahtar-english/", readable:true, ltr:true, unit:"فصل", meta:"2024 · Zamzam Publishers, Amman", desc:"الترجمة الإنجليزية لقصة أنور الأهتر، موجّهة إلى أبنائنا الذين وُلدوا ونشأوا في بلاد الغرب ليتعرّفوا إلى حكاياتنا ومصطلحاتنا التراثية."},
    {id:"khurbut", title:"خُربُط بُربُط", cat:"satire", color:"#1F2830", url:"https://raidhijazi.com/khurbut-burbut/", readable:true, meta:"الطبعة الأولى 2019", desc:"ذكريات وخواطر ظاهرها الفكاهة والتسلية، وفي باطنها مرارة وحزن."},
    {id:"darebestan", title:"ضريبستان", cat:"satire", color:"#5A4A3A", url:"https://raidhijazi.com/darebestan/", readable:true, meta:"2022 · زمزم ناشرون وموزعون، عمّان", desc:"كتاب ساخر موجّه إلى كلّ من ضاق به العيش وأثقلته الأعباء."}
  ],
  posts: [
    {title:"معصرة بيت إديس – لواء الكورة", date:"2024-11-07", url:"https://raidhijazi.com/post008/"},
    {title:"حفل إعلان توقيع كتاب شذرات من التراث", date:"2024-10-30", url:"https://raidhijazi.com/blog-shatharat/"},
    {title:"قلم رصاص", date:"2024-08-03", url:"https://raidhijazi.com/%d9%82%d9%84%d9%85-%d8%b1%d8%b5%d8%a7%d8%b5/"}
  ],
  proverbs: JSON.parse(document.getElementById("d-proverbs").textContent),
  terms: JSON.parse(document.getElementById("d-terms").textContent),
  ignored: JSON.parse(document.getElementById("d-ignored").textContent),
  media: JSON.parse(document.getElementById("d-media").textContent)
};
const BOOK_TEXT = JSON.parse(document.getElementById("d-books").textContent);
/* ===== END CONTENT ===== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
const BOOK_CATS = [["all","الكل"],["heritage","التراث"],["satire","الأدب الساخر"],["en","English"]];
const TERM_CATS = [["all","الكل"],["author","من شروح الكاتب"],["dialect","اللهجة"],["house","البيت"],["field","الحقل والبيدر"],["coffee","القهوة"]];
const catLabel = (list,id) => (list.find(c=>c[0]===id)||["",""])[1];

/* proverb of the day: same proverb for everyone on a given day */
const today = new Date();
const dayIndex = Math.floor((Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()) - Date.UTC(2026,0,1)) / 86400000);
let pvi = 0;
function fixPvi(){ const n = DATA.proverbs.length; pvi = n ? ((dayIndex % n) + n) % n : 0; }
function renderProverb(){
  $("#pv-date").textContent = today.toLocaleDateString("ar-JO",{weekday:"long", day:"numeric", month:"long"});
  const p = DATA.proverbs[pvi];
  if(!p){ $("#pv-text").textContent = "لا توجد أمثال بعد"; $("#pv-meaning").textContent = ""; $("#pv-src").textContent = ""; $("#pv-read").hidden = true; return; }
  $("#pv-text").textContent = "«" + p.text + "»";
  $("#pv-meaning").textContent = p.meaning;
  const b = p.book && bookOf(p.book), st = b && BOOK_TEXT[p.book] && BOOK_TEXT[p.book][p.si];
  $("#pv-src").textContent = st ? `ورد في قصة «${st.title}» من كتاب ${b.title}` : "";
  $("#pv-read").hidden = !st;
}
$("#pv-next").addEventListener("click", () => { if(!DATA.proverbs.length) return; pvi = (pvi + 1) % DATA.proverbs.length; renderProverb(); });
$("#pv-read").addEventListener("click", () => { const p = DATA.proverbs[pvi]; if(!p || !p.book) return; RD.hl = normMap(p.text).out; openReader(p.book, p.si); });
$("#pv-copy").addEventListener("click", async (e) => {
  const p = DATA.proverbs[pvi]; if(!p) return; const txt = p.text + " — " + p.meaning;
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(txt); btn.textContent = "نُسخ المثل"; }
  catch(err){ btn.textContent = "تعذّر النسخ"; }
  setTimeout(()=>{ btn.textContent = "نسخ المثل"; }, 1800);
});

/* posts */
$("#posts").innerHTML = DATA.posts.map(p => {
  const d = new Date(p.date).toLocaleDateString("ar-JO",{day:"numeric",month:"long",year:"numeric"});
  return `<a class="row-card" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="body"><b>${esc(p.title)}</b><span class="date">${d}</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg></a>`;
}).join("");
$("#tile-books").textContent = DATA.books.length + " كتب";
$("#tile-terms").textContent = DATA.terms.length + " مفردة تراثية";

/* library */
const COVERS = new Set(["shatharat1","shatharat2","aja","anwar","darebestan","khurbut","kharmanji","anwar-en"]);
function coverHtml(b){ return COVERS.has(b.id) ? `<span class="cover has-img" style="background:${b.color}"><img src="assets/covers/${b.id}.jpg?v=__COVV__" alt="غلاف كتاب ${esc(b.title)}" loading="lazy" decoding="async"></span>` : `<span class="cover" style="background:${b.color}">${esc(b.title)}</span>`; }
let bookCat = "all";
function renderBooks(){
  $("#book-chips").innerHTML = BOOK_CATS.map(([id,l]) => `<button class="chip" type="button" data-bcat="${id}" aria-pressed="${id===bookCat}">${l}</button>`).join("");
  const list = DATA.books.filter(b => bookCat==="all" || b.cat===bookCat);
  $("#books").innerHTML = list.map(b => `<button class="row-card" type="button" data-book="${b.id}">
      ${coverHtml(b)}
      <span class="body"><b>${esc(b.title)}</b><small>${esc(b.desc)}</small><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge${b.cat==='satire'?' coral':''}">${catLabel(BOOK_CATS,b.cat)}</span>${b.readable ? `<span class="badge">متاح للقراءة · ${storyCount(b.id)} ${b.unit==="فصل" ? "فصلاً" : "قصة"}</span>` : `<span class="badge coral">قريباً</span>`}</span></span>
    </button>`).join("");
}
$("#book-chips").addEventListener("click", e => { const b = e.target.closest("[data-bcat]"); if(!b) return; bookCat = b.dataset.bcat; renderBooks(); });
$("#books").addEventListener("click", e => { const b = e.target.closest("[data-book]"); if(b) openBook(b.dataset.book); });

function openBook(id){
  const b = DATA.books.find(x=>x.id===id); if(!b) return;
  const sh = $("#sheet");
  sh.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bk-title">
    <div class="top">${coverHtml(b)}
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><h3 id="bk-title" style="font-size:20px">${esc(b.title)}</h3><span class="badge${b.cat==='satire'?' coral':''}">${catLabel(BOOK_CATS,b.cat)}</span><span class="muted">رائد عبدالرحمن حجازي</span></div></div>
    <p>${esc(b.desc)}</p>
    ${b.readable ? `<p class="muted" style="font-size:14px">${storyCount(b.id)} ${b.unit==="فصل" ? "فصلاً" : "قصة ومقالة"}${b.meta ? " · " + esc(b.meta) : ""}</p>
    <div class="btn-row"><button class="btn" type="button" data-read="${b.id}">اقرأ الكتاب</button><a class="btn ghost" href="${esc(b.url)}" target="_blank" rel="noopener">صفحته في الموقع</a></div>`
    : `<p class="note">القراءة داخل التطبيق ستتاح قريباً بإذن الله. يمكنك الآن الاطّلاع على تفاصيل الكتاب في موقع الكاتب.</p>
    <div class="btn-row"><a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">صفحة الكتاب في الموقع</a><button class="btn ghost" type="button" data-close>إغلاق</button></div>`}
  </div>`;
  sh.hidden = false;
  (sh.querySelector("[data-read]") || sh.querySelector("[data-close]") || sh.querySelector(".btn")).focus();
}
$("#sheet").addEventListener("click", e => {
  const r = e.target.closest("[data-read]");
  if(r){ closeSheet(); openReader(r.dataset.read); return; }
  if(e.target.id==="sheet" || e.target.closest("[data-close]")) closeSheet();
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
function closeSheet(){ if(REC.on){ try{ REC.mr.onstop = null; REC.mr.stop(); }catch(e){} endRec(); } const sh=$("#sheet"); sh.hidden = true; sh.innerHTML = ""; }

/* glossary */
let termCat = "all";
const norm = s => s.replace(/[ًٌٍَُِّْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/^ال/,"").trim().toLowerCase();
function renderTerms(){
  $("#term-chips").innerHTML = TERM_CATS.map(([id,l]) => `<button class="chip" type="button" data-tcat="${id}" aria-pressed="${id===termCat}">${l}</button>`).join("");
  const q = norm($("#q").value || "");
  const list = DATA.terms.filter(t => (termCat==="all"||t.cat===termCat) && (!q || norm(t.w).includes(q) || norm(t.d).includes(q) || t.en.toLowerCase().includes(q)))
    .sort((a,b)=>norm(a.w).localeCompare(norm(b.w),"ar"));
  const raw = ($("#q").value || "").trim();
  $("#term-count").textContent = list.length + " مفردة";
  $("#terms").innerHTML = list.length ? list.map(t => `<article class="term">
      <div class="term-head"><b>${esc(t.w)}</b><span class="tag">${catLabel(TERM_CATS,t.cat)}</span></div>
      <p>${esc(t.d)}</p>${t.en ? `<p class="en" lang="en">${esc(t.en)}</p>` : ""}
      ${t.audio ? `<button class="mini play-btn" type="button" data-tplay="${DATA.terms.indexOf(t)}">ICON استمع إلى النطق</button>`.replace("ICON",'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>') : ""}
      ${t.src && bookOf(t.src) ? `<p class="src">من شرح الكاتب في كتاب «${esc(bookOf(t.src).title)}»</p>` : ""}
      ${CAN_EDIT ? `<div class="term-actions"><button class="mini" type="button" data-tedit="${DATA.terms.indexOf(t)}">تعديل</button><button class="mini" type="button" data-taud="${DATA.terms.indexOf(t)}">${t.audio ? "استبدال النطق" : "إضافة نطق"}</button><button class="mini danger" type="button" data-tdel="${DATA.terms.indexOf(t)}">حذف</button></div>` : ""}</article>`).join("")
    : (raw ? `<p class="empty">لا توجد هذه الكلمة بين مفردات المعجم بعد، وهذه مواضع ورودها في كتب الكاتب.</p>` : "");
  renderHits(raw);
}
$("#term-chips").addEventListener("click", e => { const b = e.target.closest("[data-tcat]"); if(!b) return; termCat = b.dataset.tcat; renderTerms(); });
let qTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(renderTerms, 180); });

/* ===== full-text search across the books ===== */
function normMap(s){
  let out = "", map = [];
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(/[ً-ٰٟـ]/.test(c)) continue;
    let d = c;
    if("أإآٱ".includes(c)) d = "ا"; else if(c==="ة") d = "ه"; else if(c==="ى") d = "ي";
    out += d.toLowerCase(); map.push(i);
  }
  return {out, map};
}
let SEARCH_IDX = null;
function buildIdx(){
  SEARCH_IDX = [];
  for(const b of DATA.books){
    const st = BOOK_TEXT[b.id]; if(!st) continue;
    st.forEach((s,si) => SEARCH_IDX.push({book:b.id, si, title:s.title, paras: s.paras.map(p => normMap(p).out)}));
  }
}
function snippet(p, qn){
  const {out, map} = normMap(p); const pos = out.indexOf(qn); if(pos<0) return esc(p.slice(0,120));
  const a = map[pos], z = map[pos+qn.length-1] + 1;
  const from = Math.max(0, a-55), to = Math.min(p.length, z+70);
  return (from>0?"… ":"") + esc(p.slice(from,a)) + "<mark>" + esc(p.slice(a,z)) + "</mark>" + esc(p.slice(z,to)) + (to<p.length?" …":"");
}
function markAll(p, qn){
  const {out, map} = normMap(p); let html = "", last = 0, pos = out.indexOf(qn);
  if(pos<0) return null;
  while(pos>=0){
    const a = map[pos], z = map[pos+qn.length-1] + 1;
    html += esc(p.slice(last,a)) + "<mark>" + esc(p.slice(a,z)) + "</mark>"; last = z;
    pos = out.indexOf(qn, pos+qn.length);
  }
  return html + esc(p.slice(last));
}
function renderHits(raw){
  const qn = normMap(raw).out.replace(/\s+/g," ");
  const wrap = $("#hits-wrap");
  if(qn.length < 2){ wrap.hidden = true; return; }
  if(!SEARCH_IDX) buildIdx();
  const hits = []; let total = 0;
  for(const e of SEARCH_IDX){
    let n = 0, first = -1;
    e.paras.forEach((p,pi) => { let k = p.indexOf(qn); while(k>=0){ n++; if(first<0) first = pi; k = p.indexOf(qn, k+qn.length); } });
    if(normMap(e.title).out.includes(qn) && first<0) first = 0;
    if(n || first>=0){ total += n; hits.push({...e, n, first}); }
  }
  hits.sort((a,b) => b.n - a.n);
  wrap.hidden = false;
  $("#hits-count").textContent = hits.length ? `${total} مرة في ${hits.length} قصة` : "";
  const shown = hits.slice(0,40);
  $("#hits").innerHTML = hits.length ? shown.map(h => {
    const b = bookOf(h.book); const para = BOOK_TEXT[h.book][h.si].paras[h.first] || "";
    return `<button class="hit" type="button" data-hb="${h.book}" data-hs="${h.si}">
      <span class="hh"><b>${esc(h.title)}</b><span class="src">${esc(b.title)}${h.n ? " · " + h.n + " مرة" : ""}</span></span>
      <span class="snip" dir="${b.ltr?'ltr':'rtl'}">${snippet(para, qn)}</span></button>`;
  }).join("") + (hits.length>40 ? `<p class="empty">تظهر أول 40 قصة من ${hits.length}. اكتب كلمة أدقّ لتضييق النتائج.</p>` : "")
  : `<p class="empty">لم ترد «${esc(raw)}» في كتب الكاتب المتاحة. جرّب صيغة أخرى للكلمة.</p>`;
}
$("#hits").addEventListener("click", e => {
  const h = e.target.closest("[data-hb]"); if(!h) return;
  RD.hl = normMap(($("#q").value||"").trim()).out.replace(/\s+/g," ");
  openReader(h.dataset.hb, Number(h.dataset.hs));
});

/* ===== reader ===== */
const RD = { book:null, i:1, size: Number(store.get("rh-size")) || 19, from:"library" };
const progKey = id => "rh-prog-" + id;
function getProg(id){ try{ return JSON.parse(store.get(progKey(id))) || {i:1, read:[]}; }catch(e){ return {i:1, read:[]}; } }
function setProg(id,p){ store.set(progKey(id), JSON.stringify(p)); }

/* glossary links inside the text */
let TERM_RE = null, formIx = {};
function rebuildTermRe(){
  const forms = [];
  DATA.terms.forEach((t,ix) => [...new Set((t.forms || []).concat([t.w]))].forEach(f => { f = String(f).trim(); if(f) forms.push([f,ix]); }));
  forms.sort((a,b)=>b[0].length-a[0].length);

const hashStr = s => { let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) | 0; return String(h); };
let PAGE_HASH = hashStr(JSON.stringify(PAGE));

function diffBy(before, after, id, key){
  const b = new Map(before.map(x => [id(x), key(x)])), a = new Map(after.map(x => [id(x), key(x)]));
  return { added: after.filter(x => !b.has(id(x))), changed: after.filter(x => b.has(id(x)) && b.get(id(x))!==key(x)), removed: before.filter(x => !a.has(id(x))) };
}
function pendingDiff(c){
  const t = diffBy(PAGE.terms, c.terms, x => x.w, x => JSON.stringify([x.w,x.d,x.en||"",x.cat,(x.forms||[]).join("|")]));
  const p = diffBy(PAGE.proverbs, c.proverbs, x => x.text, x => JSON.stringify([x.text,x.meaning,x.book||"",x.si==null?"":x.si]));
  const ig = diffBy(PAGE.ignored, c.ignored || [], x => x, x => x);
  return {t, p, ig, count: t.added.length+t.changed.length+t.removed.length+p.added.length+p.changed.length+p.removed.length+ig.added.length+ig.removed.length};
}

async function saveContent(c, btn, msgEl, okMsg){

  try{
    try{ sessionStorage.setItem("rh-toast", okMsg); }catch(e){}
    const mode = await publishSite(c);
    clearPending();
    if(mode==="files"){ try{ sessionStorage.removeItem("rh-toast"); sessionStorage.removeItem("rh-show-term"); sessionStorage.removeItem("rh-tab-after"); }catch(e){} btn.disabled = false; btn.textContent = label; applySaved(c, okMsg); }

    else if(["not_granted","consent_required","capability_disabled","capability_removed","transform_error"].includes(code)){ keepOnDevice(c, okMsg); }
    else if(code==="rate_limited") msgEl.textContent = "حفظتَ عدّة مرّات خلال وقت قصير. انتظر قليلاً ثم أعد المحاولة.";
    else msgEl.textContent = "تعذّر الحفظ الآن بسبب خلل مؤقت (" + (code||"غير معروف") + "). أعد المحاولة بعد قليل.";

}

/* ===== «إلى أبي»: tribute to the father, from whom the writer inherited the love of heritage ===== */
const FATHER_DEFAULT = {name: "", dedication: "في مجالسه سمعتُ الحكاية الأولى، ومنه ورثتُ حبّ التراث", quote: "", photos: []};
const FATHER_BUILTIN = (DATA.media || {}).father || null;   /* photos shipped with the app */
/* fixed content: changed only by updating data/media.json, never from the editor */
const father = () => Object.assign({}, FATHER_DEFAULT, FATHER_BUILTIN || {});
function fatherCache(){ try{ const f = father(); if(f.photos.length) localStorage.setItem("rh-father", JSON.stringify({p: mediaSrc(f.photos[0]), t: "على خُطى أبي"})); else localStorage.removeItem("rh-father"); }catch(e){} }
function renderFather(){
  const f = father(), box = $("#father"); if(!box) return;
  const has = f.photos.length > 0;
  box.hidden = !has;
  if(box.hidden){ box.innerHTML = ""; return; }
  box.innerHTML = (has ? `<div class="album">${f.photos.slice(0,2).map(p => `<img src="${esc(mediaSrc(p))}" alt="${esc(f.name || "والد الكاتب")}" loading="lazy">`).join("")}</div>` : `<p class="muted">لم تُضف صور الوالد بعد.</p>`)
    + `<h2>إلى أبي</h2><blockquote>${esc(f.dedication)}</blockquote>`
    + `<div class="fname">رائد عبدالرحمن حجازي</div>`
    + (f.quote ? `<p class="fquote">${esc(f.quote)}</p>` : "");
}
function dedHtml(){ const f = father(); if(!f.photos.length) return ""; return `<div class="ded"><img src="${esc(mediaSrc(f.photos[0]))}" alt=""><span><b style="color:#8A3A33">إلى أبي…</b> ${esc(f.dedication)}<br><small style="color:#8A3A33">رائد عبدالرحمن حجازي</small></span></div>`; }

/* ===== install the app on this device ===== */
(function(){
  let deferred = null;
  const standalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const ua = navigator.userAgent || "";
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const isInAppBrowser = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Snapchat|TikTok/i.test(ua);
  const dismissed = () => { try{ return localStorage.getItem("rh-install-x")==="1"; }catch(e){ return false; } };
  function refresh(){
    const can = !standalone() && (deferred || isIOS || isInAppBrowser);
    document.querySelectorAll("[data-install-card]").forEach(el => el.hidden = !can || dismissed());
    document.querySelectorAll("[data-install-about]").forEach(el => el.hidden = !can);
  }
  function sheet(title, body){
    const sh = $("#sheet");
    sh.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="in-h"><h3 id="in-h" style="font-size:20px">${title}</h3>${body}<div class="btn-row"><button class="btn" type="button" data-close>حسناً</button></div></div>`;
    sh.hidden = false;
  }
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; refresh(); });
  window.addEventListener("appinstalled", () => { deferred = null; refresh(); toast("نُزّل التطبيق على جهازك"); });
  document.addEventListener("click", async e => {
    if(e.target.closest("[data-install-x]")){ try{ localStorage.setItem("rh-install-x","1"); }catch(err){} refresh(); return; }
    if(!e.target.closest("[data-install]")) return;
    if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(err){} deferred = null; refresh(); return; }
    if(isInAppBrowser) return sheet("افتح الرابط في المتصفح أولاً", `<p>هذه الصفحة مفتوحة داخل تطبيق آخر لا يسمح بالتنزيل. اضغط النقاط الثلاث أو رمز المشاركة في أعلى الشاشة، واختر <b>«فتح في المتصفح»</b> (Chrome أو Safari)، ثم اضغط زر «تنزيل» من هناك.</p>`);
    if(isIOS) return sheet("تنزيل التطبيق على iPhone", `<ol class="ios-steps"><li>تأكّد أن الصفحة مفتوحة في <b>Safari</b>.</li><li>اضغط زر <b>المشاركة</b> (المربع الذي يخرج منه سهم ⬆️) أسفل الشاشة.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«إضافة»</b>.</li></ol>`);
    sheet("تنزيل التطبيق", `<p>اضغط النقاط الثلاث ⋮ في المتصفح، واختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</p>`);
  });
  refresh();
  if(window.matchMedia) try{ matchMedia("(display-mode: standalone)").addEventListener("change", refresh); }catch(e){}
})();
